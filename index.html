<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ختمة القرآن الجماعية</title>
    <style>
        :root { --primary: #1b4332; --accent: #2d6a4f; --bg: #f8f9fa; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 12px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        h1 { color: var(--primary); text-align: center; margin: 5px 0; font-size: 1.5rem; }
        p.subtitle { text-align: center; color: #6c757d; margin-bottom: 15px; font-size: 0.85rem; }
        .user-section { background: #e9ecef; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 8px; align-items: center; }
        .user-section input { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; }
        .btn-confirm-name { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
        .juz-card { border: 1px solid #dee2e6; padding: 8px; border-radius: 8px; text-align: center; background: #fff; display: flex; flex-direction: column; justify-content: space-between; min-height: 90px; }
        .juz-card.taken { background: #fff3cd; border-color: #ffe69c; }
        .juz-card.completed { background: #d1e7dd; border-color: #badbcc; }
        .juz-title { font-weight: bold; font-size: 0.95rem; }
        .reader-name { font-size: 0.8rem; color: #495057; margin: 4px 0; min-height: 16px; word-break: break-word; }
        .btn { border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: 100%; }
        .btn-select { background: var(--accent); color: white; }
        .btn-done { background: #198754; color: white; margin-bottom: 3px; }
        .btn-cancel { background: #dc3545; color: white; }
        .btn-reset { background: #e74c3c; color: white; width: 100%; padding: 10px; border-radius: 6px; margin-top: 15px; font-weight: bold; border: none; cursor: pointer; }
        .progress-bar-container { width: 100%; background: #e9ecef; border-radius: 6px; margin-bottom: 15px; height: 18px; overflow: hidden; }
        .progress-bar { height: 100%; background: #198754; width: 0%; transition: width 0.3s; text-align: center; color: white; font-size: 0.75rem; line-height: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ختمة القرآن الجماعية</h1>
    <p class="subtitle">اختر الجزء وحدث حالته فور الانتهاء</p>

    <div class="user-section">
        <input type="text" id="userName" placeholder="اكتب اسمك هنا...">
        <button class="btn-confirm-name" onclick="confirmName()">حفظ الاسم</button>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar">0%</div>
    </div>

    <div class="grid" id="juzGrid"></div>

    <button class="btn-reset" onclick="resetKhatma()">🔄 بدء ختمة جديدة (تصفير)</button>
</div>

<script>
    const DB_URL = "https://khatma-live-default-rtdb.firebaseio.com/khatma_juz";
    const TOTAL_JUZ = 30;
    let juzData = {};

    window.onload = () => {
        const savedName = localStorage.getItem('user_khatma_name');
        if (savedName) document.getElementById('userName').value = savedName;
        fetchData();
        // تحديث وتفقد التغيرات تلقائياً كل ثانيتين لخفة وسرعة الأداء
        setInterval(fetchData, 2000);
    };

    function confirmName() {
        const name = document.getElementById('userName').value.trim();
        if (!name) return alert('أدخل اسمك أولاً');
        localStorage.setItem('user_khatma_name', name);
        alert('تم حفظ الاسم: ' + name + ' ✓');
    }

    async function fetchData() {
        try {
            const res = await fetch(DB_URL + ".json");
            const data = await res.json();
            juzData = data || {};
            render();
        } catch(e) {
            console.error(e);
        }
    }

    function render() {
        const grid = document.getElementById('juzGrid');
        grid.innerHTML = '';
        let completed = 0;

        for (let i = 1; i <= TOTAL_JUZ; i++) {
            const data = juzData[i] || { status: 'free', name: '' };
            if (data.status === 'completed') completed++;

            const card = document.createElement('div');
            card.className = `juz-card ${data.status}`;

            let btns = '';
            if (data.status === 'free') {
                btns = `<button class="btn btn-select" onclick="claimJuz(${i})">حجز</button>`;
            } else if (data.status === 'taken') {
                btns = `
                    <button class="btn btn-done" onclick="completeJuz(${i})">تم ✓</button>
                    <button class="btn btn-cancel" onclick="releaseJuz(${i})">إلغاء</button>
                `;
            } else {
                btns = `<b style="color:#198754; font-size:0.8rem;">مكتمل ✓</b>`;
            }

            card.innerHTML = `
                <div class="juz-title">جزء ${i}</div>
                <div class="reader-name">${data.name ? 'القارئ: ' + data.name : 'متاح'}</div>
                ${btns}
            `;
            grid.appendChild(card);
        }

        const pct = Math.round((completed / TOTAL_JUZ) * 100);
        const pb = document.getElementById('progressBar');
        pb.style.width = pct + '%';
        pb.innerText = pct + '%';
    }

    async function claimJuz(i) {
        const name = document.getElementById('userName').value.trim();
        if (!name) return alert('اكتب اسمك واضغط "حفظ الاسم" أولاً!');
        localStorage.setItem('user_khatma_name', name);

        await fetch(`${DB_URL}/${i}.json`, {
            method: 'PUT',
            body: JSON.stringify({ status: 'taken', name: name })
        });
        fetchData();
    }

    async function completeJuz(i) {
        if (juzData[i]) {
            await fetch(`${DB_URL}/${i}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ status: 'completed' })
            });
            fetchData();
        }
    }

    async function releaseJuz(i) {
        if (confirm('إلغاء حجز هذا الجزء؟')) {
            await fetch(`${DB_URL}/${i}.json`, { method: 'DELETE' });
            fetchData();
        }
    }

    async function resetKhatma() {
        if (confirm('تصفير الختمة وبدء ختمة جديدة عند الجميع؟')) {
            await fetch(`${DB_URL}.json`, { method: 'DELETE' });
            fetchData();
        }
    }
</script>

</body>
</html>
